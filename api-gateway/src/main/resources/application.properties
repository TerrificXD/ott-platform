server.port=8080

spring.application.name=api-gateway
spring.config.import=optional:configserver:http://localhost:8888

# Phase 0: no routes yet - each business service registers its own
# route here once it exists, starting in Phase 1 with user-auth-service.
# (left blank on purpose: spring.cloud.gateway.routes defaults to none)

# left off on purpose for now: with this on, every service that
# registers with Eureka is auto-routable at /<service-id>/**, which is
# convenient later but skips deciding gateway-level concerns (auth
# filter, rate limiting, path rewriting) per route.
spring.cloud.gateway.discovery.locator.enabled=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,gateway
