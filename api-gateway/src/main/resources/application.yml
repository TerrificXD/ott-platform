server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:http://localhost:8888"
  cloud:
    gateway:
      # Phase 0: no routes yet — each business service registers its own
      # route here (or via discovery-locator) once it exists, starting
      # in Phase 1 with user-auth-service.
      routes: []
      discovery:
        locator:
          # left off on purpose for now: with this on, every service that
          # registers with Eureka is auto-routable at /<service-id>/**,
          # which is convenient later but skips deciding gateway-level
          # concerns (auth filter, rate limiting, path rewriting) per route.
          enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
