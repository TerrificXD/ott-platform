# Shared defaults every OTT microservice picks up from the Config Server
# under the "application" name (Spring Cloud Config's convention for
# config that applies to every client, regardless of its own
# spring.application.name). Per-service overrides go in a file named
# after that service, e.g. config/catalog-service.yml, and win over this.

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

spring:
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:5432/ott
    username: ott
    password: ott
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
